<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">GemmaGraph Lab 工作台界面示意图</title>
  <desc id="desc">工作台概览示意，含侧边导航、本地模型与 Docker 状态、研究工作台主卡片、统计卡片、近期运行和快速开始。</desc>
