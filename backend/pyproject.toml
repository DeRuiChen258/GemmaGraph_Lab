[project]
name = "gemmagraph-lab"
version = "0.1.0"
description = "Local, observable LangGraph software-engineering research workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "python-multipart>=0.0.18,<1",
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "aiosqlite>=0.20,<1", "httpx>=0.27,<1", "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
gemmagraph-api = "gemmagraph.main:serve"
gemmagraph-worker = "gemmagraph.worker:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemmagraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 105

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
